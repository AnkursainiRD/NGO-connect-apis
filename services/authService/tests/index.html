<!DOCTYPE html>
<html>
<head>
  <title>Firebase Google Login Test</title>
</head>
<body>
  <h2>Firebase Google Login Test</h2>

  <button id="googleLoginBtn">Login with Google</button>

  <pre id="output"></pre>
  <pre id="backendResponse"></pre>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBs3ihw9iEX8TK3R0ecS9Lxs9Y_QCPERi8",
      authDomain: "ngo-connect-2e394.firebaseapp.com",
      projectId: "ngo-connect-2e394",
      storageBucket: "ngo-connect-2e394.firebasestorage.app",
      messagingSenderId: "460857536526",
      appId: "1:460857536526:web:e2a0b282c037cc1f02cc5f",
      measurementId: "G-1T3ZF0RJW0"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Google Provider
    const provider = new firebase.auth.GoogleAuthProvider();

    document.getElementById("googleLoginBtn").onclick = async function () {
      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        const idToken = await user.getIdToken();

        // Show token + user info
        document.getElementById("output").textContent = `
User: ${JSON.stringify(user, null, 2)}

ID Token:
${idToken}
        `;

        console.log("User:", user);
        console.log("ID Token:", idToken);

        // SEND TOKEN TO BACKEND
        const backendUrl = "https://llqh65q9-3008.inc1.devtunnels.ms/api/v1/auth/social-login";

        const response = await fetch(backendUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + idToken
          },
          body: JSON.stringify({tenant_id:1})
        });

        const backendData = await response.json();

        document.getElementById("backendResponse").textContent =
          "Backend Response:\n" + JSON.stringify(backendData, null, 2);

        console.log("Backend Response:", backendData);

      } catch (error) {
        console.error(error);
        document.getElementById("output").textContent = "Error:\n" + error.message;
      }
    };
  </script>
</body>
</html>
